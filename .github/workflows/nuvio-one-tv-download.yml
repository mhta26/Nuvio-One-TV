name: Publish Nuvio One TV download

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Nuvio One TV APK build on main'
        required: true
        type: string
  workflow_run:
    workflows: [Nuvio One TV APK]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-nuvio-preview-${{ github.event.workflow_run.id || inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the successful source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/source-build.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-build.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          assert run['repository']['full_name'] == repo
          assert run['head_repository']['full_name'] == repo
          assert run['head_branch'] == 'main'
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['name'] == 'Nuvio One TV APK'
          assert run['path'] == '.github/workflows/nuvio-one-tv-preview.yml'
          assert run['conclusion'] == 'success'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={run['id']}\nsha={run['head_sha']}\nnumber={run['run_number']}\n")
          PY
      - name: Download the tested APK
        uses: actions/download-artifact@v4
        with:
          name: Nuvio-One-TV-preview
          path: ${{ runner.temp }}/nuvio-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify APK signing and prepare download
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t signers < <(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V)
          signer="${signers[-1]}"
          [[ -x "$signer" ]]
          for abi in arm64-v8a armeabi-v7a; do
            export APK_ABI="$abi"
            apk="$RUNNER_TEMP/nuvio-download/Nuvio-One-TV-$abi.apk"
            [[ -f "$apk" ]]
            "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/nuvio-signing-$abi.txt"
            python3 - <<'PY_VERIFY'
          import os, re, zipfile
          from pathlib import Path
          abi = os.environ['APK_ABI']
          root = Path(os.environ['RUNNER_TEMP'])
          text = (root / f'nuvio-signing-{abi}.txt').read_text()
          expected = 'e2c9a67239c6297fb28a28b72a088ad32cff8aeb94e0157b02d22ee7aeb5cbd8'
          digests = re.findall(r'certificate SHA-256 digest:\s*([0-9a-f]{64})', text, re.IGNORECASE)
          assert digests and digests[0].lower() == expected, text
          with zipfile.ZipFile(root / 'nuvio-download' / f'Nuvio-One-TV-{abi}.apk') as archive:
              abis = {name.split('/')[1] for name in archive.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
              assert abis == {abi}, abis
          PY_VERIFY
            sha256sum "$apk"
          done
      - name: Publish a downloadable preview release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_NUMBER: ${{ steps.source.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="tv-preview-$SOURCE_RUN_ID"
          notes="$RUNNER_TEMP/nuvio-release-notes.md"
          cat > "$notes" <<EOF_NOTES
          نسخة تجريبية من **Nuvio One TV** لأجهزة Android TV، تدعم ARM بنوعيها 32 و64 بت وAndroid 7 أو أحدث.

          حمّل ملف APK الموافق لمعمارية نظام جهازك من Assets أدناه:
          - **Nuvio-One-TV-arm64-v8a.apk** لنظام ARM 64 بت.
          - **Nuvio-One-TV-armeabi-v7a.apk** لنظام ARM 32 بت.
          كل ملف تطبيق كامل مستقل؛ ثبّت ملفًا واحدًا فقط.

          - تُثبت بجانب التطبيق الأصلي؛ لا تحذف نسختك الحالية.
          - تتضمن تحديث البوسترات من الإعدادات المتقدمة وتحسينات تحميل الصور.
          - اجتازت النسخة اختبارات البناء وفحص التوقيع، ولم تُختبر على تلفزيون فعلي بعد.
          - تتضمن إعدادات دخول Nuvio من وثيقة الاكتشاف العامة لخادمه، وإعداد Simkl حسب إعدادات البناء.

          [البناء والاختبارات](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID) · [المصدر المطابق](https://github.com/$GITHUB_REPOSITORY/tree/$SOURCE_SHA)
          EOF_NOTES
          apks=("$RUNNER_TEMP/nuvio-download/Nuvio-One-TV-arm64-v8a.apk" "$RUNNER_TEMP/nuvio-download/Nuvio-One-TV-armeabi-v7a.apk")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${apks[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
              --title "Nuvio One TV — Preview $SOURCE_NUMBER" --notes-file "$notes"
          fi
          printf '### Nuvio One TV\n\n[Download both architectures](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
