name: Nuvio One TV APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Stable release version (major.minor.patch)'
        required: false
        default: '1.2.1'
        type: string
      simkl_client_id:
        description: 'Optional public Simkl Client ID (not an account token or Client Secret)'
        required: false
        type: string
      trakt_client_id:
        description: 'Optional public Trakt Client ID (no Client Secret needed for TV device login)'
        required: false
        type: string
      trakt_redirect_uri:
        description: 'Exact Redirect URI registered in your Trakt app (used for token refresh)'
        required: false
        type: string
      mdblist_client_id:
        description: 'Optional public MDBList Client ID for a Device Code App (not an API key)'
        required: false
        type: string
  push:
    branches: [main, codex/nuvio-one-tv]
    paths:
      - 'app/**'
      - 'mediaservicecore/**'
      - 'scripts/*codex*.sh'
      - '.github/workflows/nuvio-one-tv-preview.yml'
      - '**/*.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: nuvio-one-tv-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NUVIO_ONE_TV_VERSION: ${{ inputs.app_version || vars.NUVIO_ONE_TV_VERSION || '1.2.1' }}
      CODEX_GRADLE_HEAP_MB: '6144'
      CODEX_GRADLE_METASPACE_MB: '1024'
      SIMKL_CLIENT_ID: ${{ inputs.simkl_client_id || vars.SIMKL_CLIENT_ID || secrets.SIMKL_CLIENT_ID }}
      TRAKT_CLIENT_ID: ${{ inputs.trakt_client_id || vars.TRAKT_CLIENT_ID || secrets.TRAKT_CLIENT_ID }}
      TRAKT_REDIRECT_URI: ${{ inputs.trakt_redirect_uri || vars.TRAKT_REDIRECT_URI || secrets.TRAKT_REDIRECT_URI }}
      MDBLIST_CLIENT_ID: ${{ inputs.mdblist_client_id || vars.MDBLIST_CLIENT_ID || secrets.MDBLIST_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select build workspace
        run: |
          python3 - <<'PY'
          import os, time
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"CODEX_ANDROID_WORK_DIR={os.environ['RUNNER_TEMP']}/nuvio-one-tv-build\n")
              output.write(f"NUVIO_BUILD_MINUTES={(int(time.time()) - 1767225600) // 60}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuvio-one-tv-build/gradle-cache
          key: nuvio-one-tv-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: nuvio-one-tv-${{ runner.os }}-
      - name: Verify service app identifiers
        id: service_config
        run: |
          python3 - <<'PYCONFIG'
          import os
          required = ('SIMKL_CLIENT_ID', 'TRAKT_CLIENT_ID', 'MDBLIST_CLIENT_ID')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing public app identifiers: ' + ', '.join(missing) +
                  '. Set Actions repository variables or use the manual workflow inputs.')
          print('Simkl, Trakt and MDBList app identifiers are configured; values are not printed.')
          PYCONFIG
      - name: Test account configuration and packaged font coverage
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run all release unit tests
        run: bash scripts/build-codex-preview.sh --test-only
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-One-TV-test-results
          path: |
            app/build/reports/tests/testFullReleaseUnitTest/
            app/build/test-results/testFullReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run full Android Lint
        if: ${{ !cancelled() && steps.service_config.outcome == 'success' }}
        run: bash scripts/build-codex-preview.sh --lint-only
      - name: Upload code audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-One-TV-audit-reports
          path: |
            app/build/reports/tests/testFullReleaseUnitTest/
            app/build/test-results/testFullReleaseUnitTest/
            app/build/reports/lint-results-fullRelease.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Assemble stable TV release
        run: bash scripts/build-codex-preview.sh --package-only
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-One-TV-release
          path: |
            ${{ runner.temp }}/nuvio-one-tv-build/deliverables/Nuvio-One-TV-arm64-v8a.apk
            ${{ runner.temp }}/nuvio-one-tv-build/deliverables/Nuvio-One-TV-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
