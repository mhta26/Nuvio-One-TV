name: Nuvio One TV APK

on:
  workflow_dispatch:
    inputs:
      simkl_client_id:
        description: 'Optional public Simkl Client ID (not an account token or Client Secret)'
        required: false
        type: string
  push:
    branches: [main, codex/nuvio-one-tv]
    paths:
      - 'app/**'
      - 'mediaservicecore/**'
      - 'scripts/*codex*.sh'
      - '.github/workflows/nuvio-one-tv-preview.yml'
      - '**/*.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: nuvio-one-tv-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODEX_GRADLE_HEAP_MB: '6144'
      CODEX_GRADLE_METASPACE_MB: '1024'
      SIMKL_CLIENT_ID: ${{ inputs.simkl_client_id || vars.SIMKL_CLIENT_ID || secrets.SIMKL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select build workspace
        run: echo "CODEX_ANDROID_WORK_DIR=$RUNNER_TEMP/nuvio-one-tv-build" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuvio-one-tv-build/gradle-cache
          key: nuvio-one-tv-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: nuvio-one-tv-${{ runner.os }}-
      - name: Test account configuration
        run: python3 -m unittest discover -s scripts/tests -p 'test_preview_backend.py'
      - name: Build and test personal preview
        run: bash scripts/build-codex-preview.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-One-TV-preview
          path: |
            ${{ runner.temp }}/nuvio-one-tv-build/deliverables/Nuvio-One-TV-arm64-v8a.apk
            ${{ runner.temp }}/nuvio-one-tv-build/deliverables/Nuvio-One-TV-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-One-TV-test-results
          path: app/build/reports/tests/testFullDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
